<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" role="img" aria-labelledby="title desc">
<title id="title">Vulkan dispatch — host submit to completion · Apple M4 / MoltenVK</title><desc id="desc">Vulkan dispatch — host submit to completion. Host-observed latency includes KORA/raw Vulkan submission and completion. KORA default includes output readback; deferred KORA and raw Vulkan keep output device-resident. Reference configuration: Apple M4 / MoltenVK · macos arm64.</desc>
