name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  issues: read

concurrency:
  group: kora-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      patch: ${{ steps.version.outputs.patch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Calculate next semantic version
        id: version
        shell: bash
        run: |
          base=$(tr -d '[:space:]' < VERSION)
          [[ "$base" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "invalid VERSION: $base" >&2; exit 1; }
          previous=$(git tag -l "v${base}.*" --sort=-v:refname | head -n 1)
          patch=0
          if [[ -n "$previous" ]]; then patch=$(( ${previous##*.} + 1 )); fi
          {
            echo "version=${base}.${patch}"
            echo "tag=v${base}.${patch}"
            echo "patch=${patch}"
            echo "previous=${previous}"
          } >> "$GITHUB_OUTPUT"
      - name: Stamp changelog and tag release commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          args=("$VERSION")
          if [[ -n "$PREVIOUS" ]]; then args+=(--previous-tag "$PREVIOUS"); fi
          python3 tools/release/stamp_changelog.py "${args[@]}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md
          git commit -m "chore(release): ${TAG} [skip ci]"
          git tag -a "$TAG" -m "KORA ${TAG}"
          git push origin HEAD:main "$TAG"

  package:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x86_64
            extension: tar.gz
          - os: macos-14
            artifact: macos-arm64
            extension: tar.gz
          - os: windows-2025
            artifact: windows-x86_64
            extension: zip
    runs-on: ${{ matrix.os }}
    # A runner-level stall must not hold the serialized release queue indefinitely.
    timeout-minutes: 180
    env:
      KORA_VERSION_PATCH: ${{ needs.prepare.outputs.patch }}
      VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Rust locates the MSVC linker itself. Putting MSVC on PATH for bash steps would let Git
      # Bash's /usr/bin/link (coreutils) shadow link.exe.
      - name: Verify MSVC selection
        if: runner.os == 'Windows'
        run: |
          rustc -vV | grep -q 'host: x86_64-pc-windows-msvc' || { echo 'Rust is not targeting MSVC' >&2; exit 1; }
      - name: Stamp the package version
        # Cargo and the wheel carry the full release version; the runtime reads VERSION and the patch.
        run: |
          python tools/release/stamp_cargo_version.py "$VERSION"
          cargo update --workspace
      - name: Test
        # Hosted runners have no Vulkan driver, so device tests skip; CI already ran them on lavapipe.
        timeout-minutes: 60
        run: cargo test --workspace --locked --release
      - name: Build
        run: cargo build --release --workspace --locked
      - name: Stage package
        run: |
          stage="kora-${VERSION}-${{ matrix.artifact }}"
          mkdir -p "$stage/include" "$stage/lib" "$stage/bin"
          cp crates/kora-capi/include/kora.h "$stage/include/"
          cp LICENSE README.md CHANGELOG.md "$stage/"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp target/release/kora.dll target/release/kora.dll.lib target/release/kora.lib "$stage/lib/"
            exe=.exe
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            cp target/release/libkora.dylib target/release/libkora.a "$stage/lib/"
            exe=
          else
            cp target/release/libkora.so target/release/libkora.a "$stage/lib/"
            exe=
          fi
          for tool in kora-info kora-top kora-bench kora-worker; do
            cp "target/release/${tool}${exe}" "$stage/bin/"
          done
          if [[ "${{ matrix.extension }}" == "zip" ]]; then
            cmake -E tar cf "${stage}.zip" --format=zip "$stage"
          else
            cmake -E tar czf "${stage}.tar.gz" --format=gnutar "$stage"
          fi
      - name: Build Python wheel
        run: |
          python -m pip install "maturin>=1.15,<2"
          # Release assets are not uploaded to PyPI, so the Linux wheel keeps the plain linux tag.
          compatibility=()
          if [[ "$RUNNER_OS" == "Linux" ]]; then compatibility=(--compatibility linux); fi
          maturin build --release --locked -o wheels "${compatibility[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.artifact }}
          path: |
            kora-${{ needs.prepare.outputs.version }}-${{ matrix.artifact }}.${{ matrix.extension }}
            wheels/*.whl
          if-no-files-found: error

  publish:
    needs: [prepare, package]
    if: ${{ needs.package.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Flatten wheels into the release assets
        run: |
          if [ -d dist/wheels ]; then mv dist/wheels/*.whl dist/ && rmdir dist/wheels; fi
          ls -l dist
      - name: Render release notes
        id: notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/release/render_release.py --repo "$GITHUB_REPOSITORY" --version "${{ needs.prepare.outputs.version }}" --output release.md --github-output "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ steps.notes.outputs.channel }}
          STABLE: ${{ steps.notes.outputs.stable }}
        run: |
          args=("$TAG" dist/* --title "KORA ${TAG} (${CHANNEL})" --notes-file release.md --verify-tag)
          if [[ "$STABLE" != "true" ]]; then args+=(--prerelease); fi
          gh release create "${args[@]}"
