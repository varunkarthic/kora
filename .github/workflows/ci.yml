name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    name: Linux / GCC / lavapipe
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check pull request contains the latest base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pull/${PR_NUMBER}/head"
          python3 tools/ci/check_pr_branch_freshness.py \
            "refs/remotes/origin/${BASE_REF}" \
            "refs/remotes/origin/pull/${PR_NUMBER}/head"
      - name: Check published changelog sections are immutable
        if: github.event_name == 'pull_request' && github.head_ref != 'issue/176-changelog-tag-alignment'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 tools/ci/check_changelog_sections.py \
            "refs/remotes/origin/${BASE_REF}" \
            "refs/remotes/origin/pull/${PR_NUMBER}/head"
      - name: Require a new Unreleased changelog entry
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 tools/ci/check_changelog_sections.py \
            "refs/remotes/origin/${BASE_REF}" \
            "refs/remotes/origin/pull/${PR_NUMBER}/head" \
            --require-unreleased-entry
      - name: Validate the reviewed v0.2.5 changelog correction for issue 176
        if: github.event_name == 'pull_request' && github.head_ref == 'issue/176-changelog-tag-alignment'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 tools/ci/check_changelog_sections.py \
            "refs/remotes/origin/${BASE_REF}" \
            "refs/remotes/origin/pull/${PR_NUMBER}/head" \
            --allow-version 0.2.5
      - name: Install build and Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-format \
            ninja-build \
            libvulkan-dev \
            mesa-vulkan-drivers \
            vulkan-validationlayers \
            python3-yaml \
            spirv-tools \
            glslang-tools
      - name: Locate lavapipe ICD
        run: |
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' -print -quit)"
          if [ -z "$icd" ]; then
            echo "The mesa-vulkan-drivers package did not install a lavapipe ICD manifest." >&2
            exit 1
          fi
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
      - name: Check C++ formatting
        run: find include src tests -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 | xargs -0 clang-format --dry-run --Werror
      - name: Check vendor-neutral device policy
        run: bash tools/ci/check_vendor_neutrality.sh
      - name: Configure
        run: cmake --preset debug
      - name: Build
        run: cmake --build --preset debug --parallel
      - name: Test
        run: ctest --preset debug --output-on-failure
      - name: Test with synchronization validation
        env:
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
          VK_LAYER_VALIDATE_SYNC: "1"
        run: bash tools/ci/run_sync_validation.sh
      - name: Validate installed package
        run: tools/ci/check_install.sh
      - name: Validate workflow and release tooling
        run: |
          python3 tools/ci/check_workflows.py
          python3 -m unittest discover -s tests/release -v
      - name: Build documentation
        run: |
          python3 -m pip install --break-system-packages -r docs/requirements.txt
          python3 -c "import pathlib, yaml; yaml.safe_load(pathlib.Path('.readthedocs.yaml').read_text())"
          mkdocs build --strict

  rust:
    name: Rust / Linux / lavapipe
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Vulkan runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-validationlayers glslang-tools spirv-tools
      - name: Locate lavapipe ICD
        run: |
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' -print -quit)"
          if [ -z "$icd" ]; then
            echo "The mesa-vulkan-drivers package did not install a lavapipe ICD manifest." >&2
            exit 1
          fi
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Check tool JSON contracts
        run: |
          cargo build --release --locked -p kora-tools
          python3 tests/integration/check_kora_info_json.py target/release/kora-info
          python3 tests/check_kora_bench_json.py target/release/kora-bench --gpu --cluster
      - name: Check the installed C ABI
        run: tools/ci/check_capi.sh
      - name: Check README benchmark numbers
        run: |
          python3 tools/bench-report/render.py --check
          python3 -m unittest discover -s tests/bench_report
      - name: Build and test the Python wheel
        run: |
          python3 -m venv .venv
          .venv/bin/pip install "maturin>=1.15,<2" "pytest>=8" "numpy>=1.26"
          .venv/bin/maturin build --release --locked -o wheels
          .venv/bin/pip install --no-index --find-links wheels kora-runtime
          .venv/bin/python -m pytest tests/python -q
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  platform:
    name: ${{ matrix.name }}
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS / AppleClang
            os: macos-14
          - name: Windows / MSVC
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Initialize MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset debug
      - name: Verify MSVC selection
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Select-String -Path build/debug/CMakeCache.txt -Pattern '^CMAKE_CXX_COMPILER:FILEPATH=.*cl.exe$'
          if (-not $compiler) { throw 'CMake did not select the MSVC cl.exe compiler' }
      - name: Build
        run: cmake --build --preset debug --parallel
      - name: Test
        run: ctest --preset debug --output-on-failure
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust build and test
        run: cargo test --workspace --locked
