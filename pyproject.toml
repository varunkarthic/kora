[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "kora-runtime"
dynamic = ["version"]
description = "Python bindings for the KORA compute runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
numpy = ["numpy>=1.26"]
test = ["pytest>=8", "numpy>=1.26"]

[tool.maturin]
manifest-path = "crates/kora-python/Cargo.toml"
python-source = "python"
module-name = "kora._core"
include = [{ path = "LICENSE", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
