# Generates include/kora.h; `cargo test -p kora-capi --test header` fails when it is stale.
language = "C"
include_guard = "KORA_H"
cpp_compat = true
usize_is_size_t = true
style = "type"
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true
header = """/* KORA C ABI. Generated by cbindgen from crates/kora-capi; do not edit.
 *
 * Every function is thread-safe. Functions that can fail return a KoraStatus; on failure,
 * kora_last_error_message() describes the error on the calling thread. Handles are opaque and
 * owned by the caller, who releases each with its *_destroy function (NULL is accepted).
 */"""

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[export]
prefix = ""
